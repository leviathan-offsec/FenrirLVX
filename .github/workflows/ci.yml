# .github/workflows/ci.yml
# Build, vet, test, lint on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.26.x', '1.27.x']
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Go mod download
        run: go mod download

      - name: Go mod tidy is a no-op
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "::error::go.mod or go.sum is not tidy. Run 'go mod tidy' and commit."
            git diff -- go.mod go.sum
            exit 1
          fi

      - name: Gofmt
        run: |
          # CRLF creeps in from Windows editors and makes gofmt flag every line
          # of an otherwise correct file. .gitattributes stops it, this catches it.
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            gofmt -d $unformatted | head -100
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o fenrir .

      - name: Test
        run: go test ./... -timeout 120s -race -count=1

      - name: Smoke test, version
        run: ./fenrir version

      - name: Smoke test, help does not panic
        run: ./fenrir --help

      - name: Upload binary
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.27.x'
        uses: actions/upload-artifact@v4
        with:
          name: fenrir-linux-amd64
          path: fenrir
          retention-days: 7

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, not "latest". The v1 line is built with go1.24 and cannot
          # read a go.mod declaring go 1.27, so it exits with "can't load
          # config" before linting anything. v2.14.0 is built with go1.27.
          version: v2.14.0
          args: --timeout 5m
